spring.datasource.url=jdbc:postgresql://localhost:5433/billing_db
spring.datasource.username=billing_user
spring.datasource.password=billing_pass

spring.jpa.hibernate.ddl-auto=update
spring.grpc.server.port=9091

customer.service.host=localhost
customer.service.port=9090




# ---- Resilience4j : circuit breaker ----
resilience4j.circuitbreaker.instances.customerService.register-health-indicator=true
resilience4j.circuitbreaker.instances.customerService.sliding-window-size=10
resilience4j.circuitbreaker.instances.customerService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.customerService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.customerService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.customerService.permitted-number-of-calls-in-half-open-state=3

# ---- Resilience4j : retry ----
resilience4j.retry.instances.customerService.max-attempts=3
resilience4j.retry.instances.customerService.wait-duration=500ms
resilience4j.retry.instances.customerService.enable-exponential-backoff=true
resilience4j.retry.instances.customerService.exponential-backoff-multiplier=2

# ---- Actuator : observability ----
management.endpoints.web.exposure.include=health,metrics,prometheus