global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'billing-service'
    # Prometheus defaults to /metrics. Spring Boot serves the Prometheus
    # format at /actuator/prometheus, so this line is required.
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['localhost:8080']
        labels:
          service: billing