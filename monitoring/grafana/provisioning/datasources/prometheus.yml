apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    # Both containers use host networking, so Grafana reaches Prometheus
    # over the host loopback. 9095 is Prometheus' host port (9090 is taken
    # by customer-service gRPC).
    url: http://localhost:9095
    isDefault: true
    editable: true